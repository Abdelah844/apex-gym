<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Gym</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0A10">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Letras guardadas dentro de la app (archivos .woff junto a index.html): así no se pide nada a Google y funcionan sin internet */
@font-face { font-family: "Manrope"; src: url("manrope.woff") format("woff"); font-weight: 200 800; font-display: swap; }
@font-face { font-family: "Chakra Petch"; src: url("chakra-petch-medium.woff") format("woff"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Chakra Petch"; src: url("chakra-petch-semibold.woff") format("woff"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Chakra Petch"; src: url("chakra-petch-bold.woff") format("woff"); font-weight: 700; font-display: swap; }
/* Concepto: app móvil oscura y deportiva. Una columna, tarjetas redondeadas, acento violeta, barra de 5 pestañas abajo. */
:root {
  --bg: #F4F3F8; --surface: #FFFFFF; --surface2: #ECEAF3; --surface3: #DEDAEA;
  --fg: #15131C; --muted: #6B6779; --line: #E3E0EC; --edge: rgba(124,92,255,.14);
  --accent: #6D4BFF; --accent-soft: rgba(109,75,255,.12); --on-accent: #FFFFFF;
  --pr: #C2255C; --fire: #E5701F; --good: #0B7A52; --warn: #8A5A0C; --danger: #D63B4E;
  --glow: rgba(109,75,255,.0); --on-good: #FFFFFF;
  --display: "Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08080C; --surface: #111018; --surface2: #191722; --surface3: #252232;
  --fg: #F1EFF7; --muted: #8C879C; --line: #201E2A; --edge: rgba(155,126,255,.12);
  --accent: #9B7EFF; --accent-soft: rgba(155,126,255,.14); --on-accent: #0E0820;
  --pr: #FF4D8D; --fire: #FF8A3D; --good: #3CE0A0; --warn: #FFC94D; --danger: #FF5C6E;
  --glow: rgba(155,126,255,.35); --on-good: #04140C; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #08080C; --surface: #111018; --surface2: #191722; --surface3: #252232;
  --fg: #F1EFF7; --muted: #8C879C; --line: #201E2A; --edge: rgba(155,126,255,.12);
  --accent: #9B7EFF; --accent-soft: rgba(155,126,255,.14); --on-accent: #0E0820;
  --pr: #FF4D8D; --fire: #FF8A3D; --good: #3CE0A0; --warn: #FFC94D; --danger: #FF5C6E;
  --glow: rgba(155,126,255,.35); --on-good: #04140C; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  background-image: radial-gradient(ellipse 90% 35% at 50% -8%, var(--accent-soft), transparent 70%); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; padding-block: 14px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; text-transform: uppercase; letter-spacing: .03em; }
h1 { font-size: 1.8rem; font-weight: 700; line-height: 1.05; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); font-size: .87rem; }
.small { font-size: .8rem; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack.tight { gap: 8px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; padding: 16px; }
.card.hero { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft), 0 10px 40px -10px var(--glow); }
.big-num { font-family: var(--display); font-weight: 700; font-size: 1.55rem; line-height: 1.05; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.demo-tag { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); padding: 4px 9px; border-radius: 99px; }

/* Botones */
button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
button:disabled { opacity: .45; cursor: default; }
.btn { background: var(--accent); color: var(--on-accent); font-family: var(--display); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; padding: 14px 18px; border-radius: 12px; width: 100%; font-size: .98rem; box-shadow: 0 6px 24px -6px var(--glow); }
.btn.auto { width: auto; }
.btn-sec { background: var(--surface2); color: var(--fg); font-weight: 700; padding: 11px 14px; border-radius: 11px; }
.btn-sec.full { width: 100%; }
.btn-txt { color: var(--accent); font-weight: 700; padding: 6px 0; }
.btn-danger { color: var(--danger); }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; background: var(--surface2); display: grid; place-items: center; flex: none; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.sm svg { width: 16px; height: 16px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface2); border: 1px solid transparent; border-radius: 11px; padding: 11px 12px; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: .84rem; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; background: var(--surface2); padding: 10px 12px; border-radius: 11px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.err { color: var(--danger); font-size: .85rem; font-weight: 600; }

/* Pestañas y chips */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { background: var(--surface2); padding: 8px 13px; border-radius: 99px; white-space: nowrap; font-size: .82rem; font-weight: 700; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 13px; padding: 4px; gap: 4px; }
.seg button { padding: 9px 4px; border-radius: 9px; font-weight: 700; font-size: .84rem; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.15); }

/* Cabecera */
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.05rem; flex: none; border: 1px solid var(--edge); }

/* Barras */
.bar { height: 7px; border-radius: 99px; background: var(--surface3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); box-shadow: 0 0 10px var(--glow); }
.bar.fire i { background: var(--fire); }

/* Listas */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.item:last-child { border-bottom: 0; }
.name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.pill { font-size: .68rem; font-weight: 800; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.pill.pr { background: color-mix(in srgb, var(--pr) 14%, transparent); color: var(--pr); }
.pill.up { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill.keep { background: var(--surface2); color: var(--muted); }
.pill.down { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

/* Semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .7rem; color: var(--muted); font-weight: 700; }
.week i { width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; }
.week i.on { background: var(--accent); box-shadow: 0 0 10px var(--glow); }
.week i.today { outline: 2px solid var(--fg); outline-offset: 2px; }
.week svg { width: 13px; height: 13px; }

/* Insignias */
.badge { width: 48px; height: 47px; flex: none; }
.badge.lg { width: 100px; height: 97px; }
.badge.xl { width: 136px; height: 132px; }
.badge.sm { width: 36px; height: 35px; }
.badge.md { width: 60px; height: 58px; }
.escala { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.escalon { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; border-radius: 14px; background: var(--surface2); text-align: center; font-size: .85rem; position: relative; }
.escalon.bloqueado { opacity: .45; }
.escalon.actual { outline: 2px solid var(--accent); box-shadow: 0 0 18px var(--glow); }
.escalon .pill { position: absolute; top: 6px; right: 6px; }

/* Sesión */
.ex-head { display: flex; gap: 10px; align-items: flex-start; }
.sets { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.set-h, .set { display: grid; grid-template-columns: 24px minmax(0,1fr) 60px 50px 46px 40px; gap: 5px; align-items: center; }
.set-h { font-size: .66rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 0 2px; }
.set { background: var(--surface2); border-radius: 11px; padding: 6px; }
.set.done { background: color-mix(in srgb, var(--good) 13%, var(--surface2)); }
.set .n { width: 24px; height: 24px; border-radius: 7px; background: var(--surface3); display: grid; place-items: center; font-size: .76rem; font-weight: 800; }
.set .prev { font-size: .72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.02em; text-align: left; padding: 0; }
.set input, .set select { min-height: 40px; padding: 8px 4px; text-align: center; font-weight: 700; background: var(--surface); border-radius: 8px; font-size: .9rem; }
.set select { padding: 8px 0; font-size: .8rem; }
.tick { width: 40px; height: 40px; border-radius: 9px; background: var(--surface3); display: grid; place-items: center; }
.set.done .tick { background: var(--good); color: var(--on-good); }
.tick svg { width: 18px; height: 18px; }
.rec { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); display: flex; gap: 10px; align-items: flex-start; }
.rec p { font-size: .84rem; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* Hoja inferior (modal) */
#hoja { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
#hoja .sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 90%; border-radius: 22px 22px 0 0; overflow-y: auto;
  padding-block: 16px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: subir .22s ease-out; }
@keyframes subir { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search input { padding-left: 40px; }
.gico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: .72rem; color: var(--accent); flex: none; }
ol.pasos, ul.pasos { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.anim-caja { background: var(--surface2); border-radius: 16px; overflow: hidden; }
.aviso-foto { margin-top: -4px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--fg); }
.mini-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; margin-bottom: 12px; position: relative; border-radius: 12px; overflow: hidden; padding: 0; }
.mini-fotos img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; max-width: 100%; background: var(--surface2); }
.mini-fotos span { position: absolute; right: 8px; bottom: 8px; font-size: .72rem; font-weight: 800; background: rgba(0,0,0,.7); color: #fff; padding: 3px 8px; border-radius: 6px; }
.gico.foto { object-fit: cover; padding: 0; }
.fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fotos figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; background: var(--surface2); aspect-ratio: 3 / 2; max-width: 100%; }
.fotos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fotos figcaption { position: absolute; left: 6px; bottom: 6px; font-size: .7rem; font-weight: 800; background: rgba(0,0,0,.65); color: #fff; padding: 2px 7px; border-radius: 6px; }
.anim { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; padding-top: 8px; }
.video-pendiente { border: 1px dashed var(--surface3); border-radius: 12px; padding: 10px 12px; color: var(--muted); }
.num-paso { font-family: var(--display); font-weight: 700; font-size: .8rem; color: #fff; border-radius: 8px; padding: 3px 7px; }

/* Gráficas y mapa */
.chart { width: 100%; height: auto; display: block; }
.mapa { width: 100%; max-width: 360px; margin: 0 auto; display: block; }
.mapa .zona { cursor: pointer; transition: opacity .15s; }
.mapa .zona:hover { opacity: .8; }
.mapa .zona:focus-visible { outline: none; opacity: .7; stroke: var(--fg); stroke-width: 2; }
.musculo { display: grid; grid-template-columns: 92px minmax(0,1fr) 30px; gap: 10px; align-items: center; font-size: .84rem; padding: 5px 0; }

/* Social */
.post { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.post:last-child { border-bottom: 0; }
.post .acts { display: flex; gap: 16px; font-size: .84rem; font-weight: 700; color: var(--muted); flex-wrap: wrap; }
.post .acts button.on { color: var(--pr); }
.comment { font-size: .86rem; background: var(--surface2); padding: 8px 10px; border-radius: 10px; }


/* Entreno en curso: un ejercicio a la vez */
.progreso-entreno { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0 10px; margin-bottom: 4px; display: flex; flex-direction: column; gap: 7px; }
.progreso-entreno .bar { height: 8px; }
.cronometro { font-family: var(--display); font-size: 1.35rem; font-weight: 700; color: var(--accent); }
.cronometro b { color: var(--fg); }
.chips.saltos .chip.hecho { color: var(--good); }
.foto-mini { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex: none; padding: 0; }
.foto-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.apix-entreno { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 6px 10px; border-radius: 12px; background: var(--surface2); }
.apix.xs { width: 36px; height: 36px; flex: none; }
.panel-serie { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--surface2); border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 10px; }
.panel-serie.hecho { text-align: center; }
.ajuste { display: grid; grid-template-columns: 70px 1fr 70px; gap: 8px; align-items: stretch; }
.ajuste .paso { background: var(--surface3); border-radius: 14px; font-family: var(--display); font-weight: 700; font-size: 1.15rem; min-height: 60px; }
.ajuste .paso:active { transform: scale(.96); background: var(--accent-soft); }
.ajuste .valor { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface); border-radius: 14px; padding: 4px; }
.ajuste .valor input { font-family: var(--display); font-weight: 700; font-size: 1.9rem; text-align: center; background: transparent; border: 0; padding: 0; min-height: 0; width: 100%; }
.ajuste .valor span { font-size: .7rem; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.rpe-fila { gap: 8px; justify-content: space-between; }
.rpe-fila .chip { padding: 7px 12px; }
.btn.completar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 18px; font-size: 1.05rem; }
.btn.completar svg { width: 22px; height: 22px; }
.series-lista { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.serie-fila { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 12px; padding: 5px 6px; }
.serie-fila .n { width: 30px; height: 30px; border-radius: 8px; background: var(--surface3); display: grid; place-items: center; font-size: .76rem; font-weight: 800; flex: none; }
.serie-fila .txt { text-align: left; font-weight: 700; font-size: .92rem; padding: 6px 2px; }
.serie-fila.foco { outline: 2px solid var(--accent); }
.serie-fila.done { background: color-mix(in srgb, var(--good) 13%, var(--surface2)); }
.serie-fila.done .tick { background: var(--good); color: var(--on-good); }
.serie-fila.recien { animation: serie-hecha .6s ease-out; }
@keyframes serie-hecha { 0% { transform: scale(1); } 35% { transform: scale(1.04); background: color-mix(in srgb, var(--good) 40%, var(--surface2)); } 100% { transform: scale(1); } }
.historial-rapido { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.nav-ej { margin-top: 12px; }
.mas-opciones { margin-top: 12px; }
.mas-opciones summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: .88rem; padding: 6px 0; }
.btn-terminar { margin-left: 8px; padding: 10px 14px; font-size: .82rem; }
.rpe-fila .chip { background: var(--surface3); }
.rpe-fila .chip.on { background: var(--fg); color: var(--bg); }
body.con-timer #toast { bottom: calc(300px + env(safe-area-inset-bottom, 0px)); }
#toast.pr { background: var(--pr); color: #fff; font-size: 1rem; }
@media (prefers-reduced-motion: reduce) { .serie-fila.recien, #toast { animation: none !important; } }

.seg.mini { width: auto; }
.seg.mini button { padding: 6px 10px; font-size: .78rem; }
.tabla-comp { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tabla-comp th { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: right; padding: 4px 6px; }
.tabla-comp td { padding: 7px 6px; border-top: 1px solid var(--line); text-align: right; }
.tabla-comp td:first-child, .tabla-comp th:first-child { text-align: left; }
.tabla-comp .sube { color: var(--good); font-weight: 800; }
.tabla-comp .baja { color: var(--danger); font-weight: 800; }
.fatiga { border-left: 4px solid; padding: 8px 12px; border-radius: 8px; background: var(--surface2); }
.ranking-fila .pos { width: 22px; text-align: center; font-family: var(--display); font-weight: 700; color: var(--muted); }

/* Generador y editor de rutinas */
.pasos-gen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: -6px 0 14px; }
.pasos-gen i { height: 5px; border-radius: 9px; background: var(--surface2); }
.pasos-gen i.on { background: var(--accent); }
.opcion { background: var(--surface2); border: 2px solid transparent; border-radius: 14px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; }
.opcion.fila { flex-direction: row; justify-content: flex-start; padding: 12px 14px; text-align: left; }
.opcion.on { border-color: var(--accent); background: var(--accent-soft); }
.opcion .ico, .accion-grande .ico { font-size: 1.6rem; line-height: 1; }
.chips.grandes { flex-wrap: wrap; }
.chips.grandes .chip { padding: 11px 16px; font-size: .95rem; min-width: 52px; text-align: center; }
.accion-grande { background: linear-gradient(160deg, var(--accent-soft), var(--surface)); border: 1px solid var(--accent); border-radius: 18px; padding: 16px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; }
.accion-grande b { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 1rem; }
.resumen-rutina.ok { border-color: var(--good); }
